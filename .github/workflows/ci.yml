# Deploys, and the quality gate for pull requests.
#
# The gate itself lives in vercel.json's buildCommand — lint, typecheck, tests
# and the build all run inside Vercel's build, so a red tree cannot produce a
# deployment no matter which path asks for one: this workflow, `vercel --prod`
# typed by hand during an incident, or Vercel's own Git integration. That last
# one is switched off (`git.deploymentEnabled: false`) so a push does not deploy
# twice; this workflow stays in charge because the IndexNow ping needs to
# snapshot the live sitemap BEFORE the deploy replaces it, which an automatic
# Git deploy cannot do.
#
# Consequence for this file: the `ci` job runs on PULL REQUESTS only. On a push
# the same checks run inside the Vercel build, and running them here as well
# would just be paying for them twice.
#
# Secrets required: VERCEL_TOKEN (Vercel account token). The org/project IDs
# below are not secrets.
name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  # Fast feedback before merging. On push this is redundant — vercel.json's
  # buildCommand runs the same four commands during the deploy's build.
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # prebuild generates public/sw.js; without git metadata build-sw.mjs
      # falls back to a dev- cache version, which is fine for CI.
      - name: Build
        run: npm run build

  # Production deploy: only after the full quality gate, only on master pushes.
  # Builds remotely on Vercel (same as npx vercel --prod locally).
  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Captured BEFORE deploying: Vercel purges the edge cache per deploy, so
      # this read is the sitemap of the deploy that is currently live — exactly
      # the baseline the IndexNow diff needs. (A ?cb= cache-buster would not
      # help: query strings are not part of the cache key for this route, so the
      # CDN answers HIT regardless.) A failed curl leaves the file empty, which
      # makes the diff treat every URL as new rather than break the deploy.
      - name: Snapshot the live sitemap (pre-deploy)
        run: |
          curl -sf https://getvitamind.app/sitemap.xml -o /tmp/sitemap-before.xml \
            || printf '' > /tmp/sitemap-before.xml

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_oI08l1QRpySHg7Wm7CEShc5y
          VERCEL_PROJECT_ID: prj_pe79Xe9ZpRJRLK2wJCLu1fe1KY1p
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tells Bing/Yandex/Seznam/Naver which pages this deploy added. The URL
      # list comes from this commit's app/sitemap.ts (not from the network), so
      # it needs no waiting for cache purges. Only new URLs are submitted:
      # re-submitting the whole sitemap on every deploy is what IndexNow treats
      # as abuse. continue-on-error because the deploy is already live and
      # correct at this point — a failed ping must not red-mark it. npm ci lives
      # in this step (it is needed for tsx) so its failure is covered too.
      - name: Ping IndexNow with the new URLs
        continue-on-error: true
        run: |
          npm ci
          npx tsx scripts/indexnow.ts --before /tmp/sitemap-before.xml

  # Dev deploy: pushes to the dev branch produce a Preview deployment (Preview
  # environment variables: its own VAPID keys and CRON_SECRET, isolated push
  # subscriptions) aliased to a stable URL so push-notification testing has a
  # fixed origin. This replaces the old vitamind-dev Vercel project.
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (dev preview + stable alias)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_oI08l1QRpySHg7Wm7CEShc5y
          VERCEL_PROJECT_ID: prj_pe79Xe9ZpRJRLK2wJCLu1fe1KY1p
        run: |
          url=$(npx vercel@latest deploy --yes --token "$VERCEL_TOKEN")
          npx vercel@latest alias set "$url" getvitamind-dev.vercel.app --token "$VERCEL_TOKEN"
